<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catriona Agg's Geometry Puzzles · Live Geometry</title>
<meta name="description" content="Catriona Agg's geometry puzzles, redrawn as live constructions you can drag, with links to Andrew Stacey's techniques and solutions on Mathforge Notes.">
<meta property="og:title" content="Catriona Agg's Geometry Puzzles, live">
<meta property="og:description" content="Her felt-tip puzzles redrawn as live geometry: drag the figures and feel what stays the same. Catalogued and solved by Andrew Stacey at Mathforge Notes.">
<meta property="og:url" content="https://livegeometry.com/CatrionaAgg">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Live Geometry">
<meta property="og:image" content="https://livegeometry.com/CatrionaAgg/previews/index.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://livegeometry.com/CatrionaAgg">
<meta name="color-scheme" content="light dark">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-10ZM10J6RW"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-10ZM10J6RW');
</script>
<script>
  (function () {
    var theme = null;
    try { theme = localStorage.getItem('LiveGeometry.Theme'); } catch (e) { }
    if (theme !== 'Light' && theme !== 'Dark') {
      theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'Dark' : 'Light';
    }
    document.documentElement.setAttribute('data-theme', theme.toLowerCase());
  })();
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/CatrionaAgg/catriona.css">
<script src="/player/1/player.js" defer></script>
<script src="/CatrionaAgg/catriona.js" defer></script>
</head>
<body>

<div id="puzzle-view">
  <header class="topbar">
    <a class="back" id="back" href="/CatrionaAgg" title="All puzzles (Escape)"><svg><use href="/CatrionaAgg/icons.svg#icon-back"/></svg><span class="label">All puzzles</span></a>
    <span class="crumb-sep optional"></span>
    <a class="brand" href="/" title="Live Geometry"><img src="/logo.svg" alt=""><span class="site">Live Geometry</span></a>
    <span class="spacer"></span>
    <div class="stepper">
      <a class="icon-button" id="previous" title="Previous puzzle (←)"><svg><use href="/CatrionaAgg/icons.svg#icon-back"/></svg></a>
      <span class="position" id="position"></span>
      <a class="icon-button" id="next" title="Next puzzle (→)"><svg><use href="/CatrionaAgg/icons.svg#icon-next"/></svg></a>
    </div>
    <span class="spacer"></span>
    <button class="icon-button theme" aria-label="Light or dark"><svg class="moon"><use href="/CatrionaAgg/icons.svg#icon-moon"/></svg><svg class="sun"><use href="/CatrionaAgg/icons.svg#icon-sun"/></svg></button>
  </header>
  <div class="puzzle-body" id="puzzle-body">
    <div class="stage">
      <div id="player"></div>
      <div class="stage-tools">
        <button id="fit" title="Fit the drawing to the window (Home)"><svg><use href="/CatrionaAgg/icons.svg#icon-fit"/></svg><span>Fit</span></button>
        <button id="reset" title="Back to the drawing as it was"><svg><use href="/CatrionaAgg/icons.svg#icon-reset"/></svg><span>Start over</span></button>
      </div>
    </div>
    <aside class="panel">
      <p class="date" id="p-date"></p>
      <h1 id="p-title"></h1>
      <blockquote class="question">
        <p id="p-question"></p>
        <footer id="p-asked"></footer>
      </blockquote>
      <div class="links" id="p-links"></div>
      <div class="tags" id="p-tags"></div>
      <p class="credit" id="p-credit"></p>
    </aside>
  </div>
</div>
</body>
</html>
