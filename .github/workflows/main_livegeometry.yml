# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Avalonia Browser (WASM) app to Azure Web App - livegeometry

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    # Linux, not Windows: the Windows image carries Visual Studio's MAUI, iOS, Mac Catalyst
    # and Android workloads, and installing wasm-tools there moved the whole workload set to
    # a new version and reinstalled all of those through MSIs (over half of a 9 minute step).
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: dotnet publish
        # Publish output is a self-contained static site: web.config at the root
        # (IIS MIME maps, compression, SPA fallback) plus wwwroot/ with the app.
        run: dotnet publish Main/Avalonia/LiveGeometry.Browser/LiveGeometry.Browser.csproj -c Release -o "${{ github.workspace }}/publish"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: publish

  build-windows:
    # The same publish on Windows, as a check only (the deploy uses the Linux build). Ref12.WasmNative
    # brings the native toolchain from NuGet, so nothing is installed and the image's Visual Studio
    # workloads are left alone.
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: dotnet publish
        run: dotnet publish Main/Avalonia/LiveGeometry.Browser/LiveGeometry.Browser.csproj -c Release -o "${{ github.workspace }}/publish"

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_591D5E6D922D48A28EE924A1AB659ECF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A6A83D0B1D914966BEFB34F32998455D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_02EDA1B7934644E4B80958CC4E9021F2 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'livegeometry'
          slot-name: 'Production'
          package: .
          